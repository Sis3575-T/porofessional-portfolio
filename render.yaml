services:
  - type: web
    name: portfolio-backend
    runtime: node
    plan: free
    buildCommand: npm install && cd services/shared && npm install && cd ../backend && npm install && npx prisma generate --schema=../../prisma/schema.prisma
    startCommand: cd services/backend && node src/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        value: portfolio-pro-super-secret-jwt-key-2024
      - key: JWT_EXPIRY
        value: 7d
      - key: ADMIN_EMAIL
        value: sisay3575@gmail.com
      - key: FRONTEND_URL
        value: https://porofessional-portfolio-web.vercel.app
      - key: ADMIN_URL
        value: https://porofessional-portfolio-admin.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        value: dto10sv4y
      - key: CLOUDINARY_API_KEY
        value: "476678795163495"
      - key: CLOUDINARY_API_SECRET
        value: tJ7vjnboe1XocYAJjTJ73sufDMM
      - key: NODE_ENV
        value: production
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SITE_NAME
        value: Porofessional Portfolio

  - type: web
    name: portfolio-web
    runtime: node
    plan: free
    buildCommand: cd apps/web && npm install && npm run build
    startCommand: cd apps/web && npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_URL
        value: https://portfolio-ss.onrender.com
      - key: NODE_ENV
        value: production

  - type: web
    name: portfolio-admin
    runtime: node
    plan: free
    buildCommand: cd apps/admin && npm install && npm run build
    startCommand: cd apps/admin && npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_URL
        value: https://portfolio-ss.onrender.com
      - key: NODE_ENV
        value: production
